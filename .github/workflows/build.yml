name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite"
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Pin vcpkg downloads directory
        shell: bash
        run: echo "VCPKG_DOWNLOADS=${{ github.workspace }}/vcpkg_downloads" >> "$GITHUB_ENV"

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 00c5775211f45cd08b37fce0484b4cb940e422ab
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: false

      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_binary_cache
            ${{ github.workspace }}/vcpkg_downloads
          key: ${{ runner.os }}-vcpkg-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-static-md-

      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCOMMONLIB_ENABLE_IPO=OFF

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: PortableOneRoomMag
          path: |
            build/PortableOneRoomMag.dll
            build/PortableOneRoomMag.pdb

      - name: Publish DLL to the dist branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir dist_out && cp build/PortableOneRoomMag.dll dist_out/
          cd dist_out
          git init -q -b dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dist
